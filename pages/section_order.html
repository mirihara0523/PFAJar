<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Section Manager — PFA Jar</title>
  <link rel="stylesheet" href="../css/detect_live.css">
</head>
<body class="section-order-viewer">
  <header>
    <div class="section-header-main">
      <div class="section-heading"><strong>Section Manager</strong><span id="count"></span></div>
      <div class="section-addresses">
        <p id="orderInput" class="section-path order-note"></p>
        <p id="orderSource" class="section-path order-note"></p>
      </div>
    </div>
    <nav class="section-navigation" aria-label="Section navigation"><button id="orderPrevious" title="Previous section (↑ Up Arrow)" aria-keyshortcuts="ArrowUp">Previous</button><button id="orderNext" title="Next section (↓ Down Arrow)" aria-keyshortcuts="ArrowDown">Next</button></nav>
  </header>
  <main>
    <section class="section-preview-pane" aria-label="DAPI preview">
      <div id="viewport"><img id="sectionPreview" alt="Selected DAPI section" hidden></div>
      <p id="orderStatus" role="status">Loading workspace DAPI sections…</p>
    </section>
    <aside>
      <div class="section-controls">
      <div class="section-sort"><label for="orderMode">Sort sections:</label><select id="orderMode"><option value="filename">Filename</option><option value="ap_ascending">AP ascending</option><option value="ap_descending">AP descending</option><option value="custom">Custom</option></select></div>
      <p class="order-note">Drag sections or use Up / Down. AP uses saved alignment positions, which may include estimates. Missing AP sorts last.</p>
      <div class="order-actions"><button id="orderUp" title="Move selected section up (Ctrl + ↑)" aria-keyshortcuts="Control+ArrowUp">Up</button><button id="orderDown" title="Move selected section down (Ctrl + ↓)" aria-keyshortcuts="Control+ArrowDown">Down</button></div>
      <ol id="orderList" role="list" aria-label="Sections"></ol>
      <button id="flipSection" title="Save pending changes first. Requires a project with data under its data folder. Close other analysis windows before applying.">Flip Left/Right…</button>
      </div>
      <button id="saveSectionOrder" class="primary">Save order / active states</button>
    </aside>
  </main>
  <script src="../js/run.js" data-entry="section_order.js"></script>
</body>
</html>
