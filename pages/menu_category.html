<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <title>Mason Jar</title>
  </head>
  <body>
    <div id="parent" class="container h-100">
      <div class="row align-items-center m-4">
        <div class="col">
          <nav
            id="navTrail"
            class="nav-trail-wrap text-muted small mb-1"
            aria-label="Breadcrumb"
          ></nav>
          <h1 id="categoryTitle">Tools</h1>
        </div>
      </div>
      <div
        id="legacyModeCategoryBanner"
        class="row m-2 d-none"
        aria-label="Legacy mode notice"
      >
        <div class="col">
          <div class="alert alert-warning text-start mb-0">
            Some tools are unavailable or limited in legacy mode.
            <a href="./workspace_menu.html">View limitations on the workspace menu</a>.
          </div>
        </div>
      </div>
      <div class="row align-items-center m-2">
        <div class="col d-grid gap-2" id="toolLinks"></div>
      </div>
      <div class="row align-items-center m-4">
        <div class="col d-grid gap-2">
          <a role="button" class="btn btn-warning" href="./workspace_menu.html"
            >Back to workspace</a
          >
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="../js/run.js" data-entry="menu_category.js"></script>
  </body>
</html>
