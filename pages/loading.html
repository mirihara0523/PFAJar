<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'  https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;">
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'  https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;">
    <title>PFA Jar</title>
  </head>
  <body>
    <div id="parent" class="container h-100">
      <div class="row align-items-center">
        <div class="col">
          <h1>PFA Jar</h1>
          <p id="version">...</p>
          <p>
            <br>
            PFA Jar is a tool for neuroanatomical studies in the mouse brain.
            <br>
          </p>
        </div>
      </div>
      <div class="row align-items-center">
        <div class="col d-grid">
          <div class="fa-3x" id="loadingSpinner">
            <i class="fas fa-spinner fa-spin"></i>
          </div>
        </div>
    </div>
    <div class="row align-items-center">
      <div class="col d-grid">
        <p id="status">Starting up...</p>
        <section id="packageProgress" hidden aria-label="Package installation details">
          <p id="packageActivity" style="overflow-wrap: anywhere;"></p>
          <p id="packageTiming"></p>
          <p id="packageProcessState" role="status"></p>
          <pre id="packageOutput" style="white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto;"></pre>
        </section>
        <div id="setupFailure" hidden role="alert">
          <p>Setup has stopped because of an error. It is not still updating.</p>
          <pre id="setupFailureDetails" style="white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto;"></pre>
          <button id="showSetupLog" type="button" class="btn btn-outline-secondary">Show error log</button>
          <p>Restart PFA Jar after resolving the error to retry setup.</p>
        </div>
      </div>
    </div>
    <script src="../js/run.js" data-entry="loading.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
