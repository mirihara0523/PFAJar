<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="../node_modules/@fortawesome/fontawesome-free/css/all.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <title>Mason Jar</title>
  </head>
  <body class="menu-page">
    <div id="parent" class="container menu-shell">
      <header class="menu-hero text-center">
        <h1 class="menu-hero-title">Mason Jar</h1>
        <p class="menu-hero-version text-muted mb-1" id="version"></p>
        <p class="menu-hero-subtitle">
          Mouse brain neurohistology — alignment, detection, quantification.
        </p>
        <div id="projectChip" class="menu-project-chip d-none"></div>
      </header>

      <section class="hub-actions mb-4" aria-label="Project actions">
        <div class="hub-actions-primary d-grid gap-2 d-sm-flex flex-sm-wrap justify-content-center">
          <a class="btn btn-primary" href="./project_start.html">New project</a>
          <button type="button" class="btn btn-outline-primary" id="openProject">
            Load project file
          </button>
          <a
            class="btn btn-success d-none"
            href="./workspace_menu.html"
            id="openPipeline"
            >Continue to tools →</a
          >
          <a class="btn btn-outline-secondary" href="#" id="guide">Guide</a>
          <button type="button" class="btn btn-outline-secondary d-none" id="checkUpdates">
            Check for updates…
          </button>
          <button type="button" class="btn btn-outline-secondary d-none" id="rescanProjectHub">
            Rescan project files
          </button>
          <a class="btn btn-outline-secondary" href="./credits.html">Credits</a>
          <a class="btn btn-outline-secondary" href="./settings.html">Settings</a>
          <button type="button" class="btn btn-outline-secondary" id="toggleAppLog">
            Application log
          </button>
        </div>
      </section>

      <section class="hub-recent mb-4" aria-label="Recent projects">
        <h2 class="h6 text-muted mb-2">Recent projects</h2>
        <ul id="recentProjects" class="list-group list-group-flush hub-recent-list small"></ul>
      </section>

      <section class="mb-3" aria-label="Batch processing">
        <a class="menu-card menu-card-batch d-block" href="./batch_wizard.html">
          <i class="fas fa-tasks menu-card-icon" aria-hidden="true"></i>
          <span class="menu-card-title">Batch</span>
          <span class="menu-card-sub">Run steps across multiple projects</span>
        </a>
      </section>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="../js/hub_version.js"></script>
    <script src="../js/run.js" data-entry="open_guide.js,menu.js"></script>
  </body>
</html>
